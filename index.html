<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCR с камеры</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        #video {
            width: 100%;
            border: 2px solid #333;
            border-radius: 8px;
        }
        button {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        #result {
            margin-top: 20px;
            white-space: pre-wrap;
            border: 1px solid #ddd;
            padding: 15px;
            min-height: 100px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>OCR с камеры (кириллица)</h1>
    
    <video id="video" autoplay playsinline></video>
    <button id="captureBtn">Сделать снимок и распознать</button>
    <button id="downloadBtn" disabled>Скачать TXT</button>
    
    <h3>Распознанный текст:</h3>
    <div id="result"></div>

    <!-- Подключаем Tesseract.js -->
    <script src="https://unpkg.com/tesseract.js@v2.0.0-alpha.13/dist/tesseract.min.js"></script>
    <script>
        class OCRApp {
            constructor() {
                this.video = document.getElementById('video');
                this.captureBtn = document.getElementById('captureBtn');
                this.downloadBtn = document.getElementById('downloadBtn');
                this.resultDiv = document.getElementById('result');
                
                this.capturedImages = [];
                this.recognizedText = '';
                
                this.init();
            }
            
            async init() {
                try {
                    // Запрашиваем доступ к камере
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: 'environment' // Задняя камера
                        }
                    });
                    this.video.srcObject = stream;
                    
                    // Инициализируем Tesseract с поддержкой русского языка
                    this.worker = await Tesseract.createWorker({
                        logger: info => {
                            console.log(info);
                            if (info.status === 'recognizing text') {
                                this.updateStatus(`Распознавание: ${Math.round(info.progress * 100)}%`);
                            }
                }
            });
            await this.worker.loadLanguage('rus');
            await this.worker.initialize('rus');
            
            this.setupEventListeners();
        } catch (error) {
            alert('Ошибка доступа к камере: ' + error.message);
            console.error(error);
        }
    }
    
    setupEventListeners() {
        this.captureBtn.addEventListener('click', () => this.captureAndRecognize());
        this.downloadBtn.addEventListener('click', () => this.downloadTextFile());
    }
    
    captureAndRecognize() {
        // Создаём canvas для захвата кадра
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        canvas.width = this.video.videoWidth;
        canvas.height = this.video.videoHeight;
        context.drawImage(this.video, 0, 0);
        
        // Конвертируем в data URL
        const imageDataUrl = canvas.toDataURL('image/png');
        this.capturedImages.push(imageDataUrl);
        
        // Запускаем распознавание
        this.recognizeText(imageDataUrl);
    }
    
    async recognizeText(imageDataUrl) {
        this.updateStatus('Распознавание...');
        this.captureBtn.disabled = true;
        
        try {
            const { data: { text } } = await this.worker.recognize(imageDataUrl);
            
            // Добавляем новый текст к существующему
            if (text.trim()) {
                this.recognizedText += text.trim() + '\n\n';
                this.resultDiv.textContent = this.recognizedText;
                this.downloadBtn.disabled = false;
            }
            
            this.updateStatus('Готово!');
        } catch (error) {
            this.updateStatus('Ошибка распознавания');
            console.error('Ошибка OCR:', error);
        } finally {
            this.captureBtn.disabled = false;
        }
    }
    
    downloadTextFile() {
        if (!this.recognizedText.trim()) return;
        
        const blob = new Blob([this.recognizedText], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = url;
        a.download = 'распознанный_текст_' + new Date().toISOString().split('T')[0] + '.txt';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
    
    updateStatus(message) {
        this.captureBtn.textContent = message;
        setTimeout(() => {
            this.captureBtn.textContent = 'Сделать снимок и распознать';
        }, 2000);
    }
}

// Запускаем приложение при загрузке страницы
document.addEventListener('DOMContentLoaded', () => {
    new OCRApp();
});
    </script>
</body>
</html>
