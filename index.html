<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCR с камеры (кириллица)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        #video {
            width: 100%;
            border: 2px solid #333;
            border-radius: 8px;
        }
        button {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        #result {
            margin-top: 20px;
            white-space: pre-wrap;
            border: 1px solid #ddd;
            padding: 15px;
            min-height: 100px;
            border-radius: 4px;
        }
        .status {
            color: #666;
            font-style: italic;
            margin: 5px 0;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #007bff;
        }
    </style>
</head>
<body>
    <h1>OCR с камеры (кириллица)</h1>

    <video id="video" autoplay playsinline></video>
    <button id="captureBtn" disabled>Сделать снимок и распознать</button>
    <button id="downloadBtn" disabled>Скачать TXT</button>

    <div class="status" id="status">Загрузка Tesseract...</div>
    <div id="loadingIndicator" class="loading">
        <p>Идёт инициализация OCR...</p>
        <p id="progressText">0%</p>
    </div>

    <h3>Распознанный текст:</h3>
    <div id="result"></div>

    <!-- Подключаем Tesseract локально -->
    <script src="./js/tesseract.min.js"></script>
    <script>
        class OCRApp {
            constructor() {
                this.video = document.getElementById('video');
                this.captureBtn = document.getElementById('captureBtn');
                this.downloadBtn = document.getElementById('downloadBtn');
                this.resultDiv = document.getElementById('result');
                this.statusDiv = document.getElementById('status');
                this.loadingDiv = document.getElementById('loadingIndicator');

                this.capturedImages = [];
                this.recognizedText = '';
                this.worker = null;

                // Ждём полной загрузки Tesseract
                if (typeof Tesseract !== 'undefined') {
                    this.init();
                } else {
                    this.handleError('Библиотека Tesseract не загрузилась');
                }
            }

            async init() {
                try {
                    // Показываем индикатор загрузки
                    this.showLoading(true);

                    // Инициализируем Tesseract
                    await this.initOCR();

                    // Запрашиваем доступ к камере с высоким разрешением
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: 'environment',
                            width: { ideal: 1920 },
                            height: { ideal: 1080 }
                        }
                    });
                    this.video.srcObject = stream;

                    // Активируем кнопки
                    this.captureBtn.disabled = false;
                    this.updateStatus('Камера готова. Нажмите "Сделать снимок"');
                    this.showLoading(false);
                } catch (error) {
                    this.handleError('Ошибка инициализации: ' + error.message);
                    this.showLoading(false);
                }
            }

            async initOCR() {
                try {
                    this.updateStatus('Создание OCR‑воркера...');
                    
                    // Создаем воркер с русским и английским языками, OEM 3 (комбинированный режим)
                    this.worker = await Tesseract.createWorker('rus+eng', 3, {
                        logger: info => {
                            if (info.status === 'recognizing text') {
                                this.updateProgress(`${Math.round(info.progress * 100)}%`);
                            }
                        }
                    });
                    
                    // Устанавливаем режим сегментации страницы (автоматический)
                    await this.worker.setParameters({
                        tessedit_pageseg_mode: Tesseract.PSM.AUTO,
                    });
                    
                    this.updateStatus('Tesseract готов к работе');
                } catch (error) {
                    throw new Error('Ошибка загрузки Tesseract: ' + error.message);
                }
            }

            showLoading(show) {
                this.loadingDiv.style.display = show ? 'block' : 'none';
            }

            updateStatus(message) {
                this.statusDiv.textContent = message;
            }

            updateProgress(progressText) {
                const progressDiv = document.getElementById('progressText');
                if (progressDiv) {
                    progressDiv.textContent = progressText;
                }
            }

            captureAndRecognize() {
                if (!this.video.videoWidth || !this.video.videoHeight) {
                    this.handleError('Видеопоток не готов');
                    return;
                }

                // Создаем canvas для захвата кадра
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // Оптимальная ширина для OCR (баланс качество/скорость)
                const MAX_WIDTH = 1500;
                let width = this.video.videoWidth;
                let height = this.video.videoHeight;
                
                if (width > MAX_WIDTH) {
                    height = Math.round((height * MAX_WIDTH) / width);
                    width = MAX_WIDTH;
                }
                
                canvas.width = width;
                canvas.height = height;
                
                // Рисуем изображение с камеры
                ctx.drawImage(this.video, 0, 0, width, height);
                
                // === ПРЕДОБРАБОТКА ИЗОБРАЖЕНИЯ ===
                const imageData = ctx.getImageData(0, 0, width, height);
                const data = imageData.data;
                
                // Переводим в оттенки серого и применяем бинаризацию
                for (let i = 0; i < data.length; i += 4) {
                    // Вычисляем яркость пикселя
                    const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                    
                    // Бинаризация с порогом (делаем текст черным, фон белым)
                    const binary = gray > 110 ? 255 : 0;
                    
                    data[i] = binary;     // R
                    data[i + 1] = binary; // G
                    data[i + 2] = binary; // B
                    // data[i + 3] - альфа не меняем
                }
                
                ctx.putImageData(imageData, 0, 0);
                
                const imageDataUrl = canvas.toDataURL('image/png');
                this.capturedImages.push(imageDataUrl);
                this.recognizeText(imageDataUrl);
            }

            async recognizeText(imageDataUrl) {
                this.updateStatus('Распознавание...');
                this.captureBtn.disabled = true;

                try {
                    const { data: { text } } = await this.worker.recognize(imageDataUrl);

                    if (text.trim()) {
                        this.recognizedText += text.trim() + '\n\n';
                        this.resultDiv.textContent = this.recognizedText;
                        this.downloadBtn.disabled = false;
                        this.updateStatus('Готово! Текст распознан');
                    } else {
                        this.updateStatus('Текст не распознан. Попробуйте другой снимок');
                    }
                } catch (error) {
                    this.handleError('Ошибка распознавания: ' + error.message);
                } finally {
                    this.captureBtn.disabled = false;
                }
            }

            downloadTextFile() {
                if (!this.recognizedText.trim()) {
                    alert('Нет текста для сохранения');
                    return;
                }

                const blob = new Blob([this.recognizedText], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.href = url;
                a.download = 'распознанный_текст_' + new Date().toISOString().split('T')[0] + '.txt';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }

            handleError(message) {
                this.updateStatus('ОШИБКА: ' + message);
                console.error(message);
                alert(message);
            }
        }

        // Запускаем приложение после полной загрузки страницы
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const app = new OCRApp();

                // Добавляем обработчики событий
                document.getElementById('captureBtn').addEventListener('click', () => {
                    app.captureAndRecognize();
                });

                document.getElementById('downloadBtn').addEventListener('click', () => {
                    app.downloadTextFile();
                });
            } catch (error) {
                console.error('Критическая ошибка при запуске приложения:', error);
                alert('Не удалось запустить приложение: ' + error.message);
            }
        });
    </script>
</body>
</html>
